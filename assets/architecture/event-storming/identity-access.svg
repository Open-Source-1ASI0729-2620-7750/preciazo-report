l verification.</text><text x="325.5" y="671.649" fill="#000" font-size="15" textLength="492.773">Domain events contain no credentials, password hashes or bearer tokens.</text></g><!--entity hotspot--><g class="entity" data-qualified-name="hotspot" id="ent0039" data-source-line="47"><rect x="311.5" y="712.609" width="521.094" height="114.336" fill="#FFB7AB" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="537.857" y="738.181" fill="#000" font-size="15" textLength="68.379" font-style="italic">«Hotspot»</text><text x="330.267" y="757.048" fill="#000" font-size="15" textLength="483.56">Configure lock threshold/duration, password policy and JWT parameters.</text><text x="326.48" y="775.915" fill="#000" font-size="15" textLength="491.133">Define security proof provider, binding, single-use validation and deadline.</text><text x="321.5" y="794.782" fill="#000" font-size="15" textLength="501.094">Role lifecycle, global attempt limiting and account recovery remain pending.</text><text x="348.178" y="813.649" fill="#000" font-size="15" textLength="447.737">No ACL, refresh-token flow or unsupported single-token revocation.</text></g><!--link read0 to actor0--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-source-line="14" data-link-type="dependency"><path d="M351.46,84.109 C360.93,84.109 365.4,84.109 374.88,84.109" style="stroke:#181818;stroke-width:1;" fill="none" id="read0-to-actor0"/><polygon points="379.88,84.109,370.88,80.109,374.88,84.109,370.88,88.109,379.88,84.109" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link actor0 to cmd0--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk7" data-source-line="15" data-link-type="dependency"><path d="M454.06,84.109 C477.88,84.109 496.7,84.109 520.53,84.109" style="stroke:#181818;stroke-width:1;" fill="none" id="actor0-to-cmd0"/><polygon points="525.53,84.109,516.53,80.109,520.53,84.109,516.53,88.